name: package
on: workflow_dispatch
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with pyinstaller pyinstaller packaging.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: papermind-${{ matrix.os }}
          path: dist/papermind
