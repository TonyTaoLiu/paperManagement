[project]
name = "papermind"
version = "0.1.0"
description = "PaperMind: local-first paper memory library"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "numpy>=1.26",
    "tomli-w>=1.0",
]

[project.scripts]
papermind = "papermind.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7", "pytest-asyncio>=0.24", "playwright>=1.48"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/papermind"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
